name: E2E

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?options=-csearch_path%3Dauth
      AUTH_SECRET: ci-secret-change-in-production
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000/api/auth
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate schema artifacts
        run: yarn db:generate

      - name: Create auth schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d app -c "CREATE SCHEMA IF NOT EXISTS auth;"

      - name: Prepare database
        run: yarn auth:migrate && yarn db:push

      - name: Run Playwright tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
