name: Build Dev Image

# Rebuild and push the dev container image when its inputs change.
# CI pulls this pre-built image instead of building from scratch (~30s vs ~10min).

on:
  push:
    branches: [main]
    paths:
      - '.claude/docker/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/postinstall.ts'
  workflow_dispatch: # manual trigger for first build or force rebuild

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune -af

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .claude/docker/Dockerfile.ralphex
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
