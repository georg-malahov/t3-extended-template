name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/prompts/**'
      - '.claude/settings.json'
      - '.claude/settings.local.json'
      - '.ralphex/**'
      - '.cursor/**'
      - '.github/CODEOWNERS'
      - '.env.example'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/prompts/**'
      - '.claude/settings.json'
      - '.claude/settings.local.json'
      - '.ralphex/**'
      - '.cursor/**'
      - '.github/CODEOWNERS'
      - '.env.example'
      - 'LICENSE'

# Dev image is pre-built and pushed to GHCR by build-dev-image.yml.
# CI pulls it (~90s) instead of building from scratch (~10min).

jobs:
  # ── Fast checks: native Bun, no Docker ───────────────────────────────
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate types
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

  # ── E2E tests: 4 shards, each with its own container ─────────────────────
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      CONTAINER: t3app-ci-${{ matrix.shard }}
      IMAGE: ghcr.io/${{ github.repository }}/dev:latest
      NM_VOLUME: t3app-ci-${{ matrix.shard }}-nm

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull dev image from GHCR
        id: pull
        run: docker pull $IMAGE
        continue-on-error: true

      - name: Build dev image (fallback if GHCR image not available)
        if: steps.pull.outcome == 'failure'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune -af
          docker build -t $IMAGE -f .claude/docker/Dockerfile.ralphex .

      - name: Start container
        run: |
          docker run -d --init --name $CONTAINER \
            -v "${{ github.workspace }}":/workspace \
            -v $NM_VOLUME:/workspace/node_modules \
            -p 3000:3000 \
            $IMAGE sleep infinity

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 60); do
            if docker exec $CONTAINER pg_isready -q 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "PostgreSQL failed to start"
              docker logs $CONTAINER
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for node_modules (watching app-init log)..."
          for i in $(seq 1 120); do
            if docker logs $CONTAINER 2>&1 | grep -q "\[app-init\]"; then
              echo "app-init completed:"
              docker logs $CONTAINER 2>&1 | grep "\[app-init\]"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "app-init did not complete within 120s — debugging:"
              docker logs $CONTAINER 2>&1 | tail -30
              exit 1
            fi
            sleep 1
          done

      - name: Run codegen and migrations
        run: |
          docker exec $CONTAINER bun run db:generate
          docker exec $CONTAINER bun run auth:migrate
          docker exec $CONTAINER bun run db:migrate

      - name: Start dev server
        run: docker exec -d $CONTAINER bun run dev -- --hostname 0.0.0.0 --port 3000

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000 2>/dev/null; then
              echo "App is ready at http://localhost:3000"
              exit 0
            fi
            echo "Waiting for app... ($i/60)"
            sleep 5
          done
          echo "App failed to start"
          docker logs $CONTAINER
          exit 1

      - name: E2E tests (shard ${{ matrix.shard }}/4)
        run: docker exec -e CI=true $CONTAINER bun run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Container logs (on failure)
        if: failure()
        run: docker logs $CONTAINER

  # ── Merge reports from all shards ─────────────────────────────────────────
  report:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        if: hashFiles('all-blob-reports/**') != ''
        run: bunx playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Playwright test results summary
        if: always() && github.event_name == 'pull_request' && hashFiles('playwright-report/results.json') != ''
        uses: daun/playwright-report-summary@b223a65bd3965c7cced5feba27dbc0c06acc51b2 # v3.9.0
        with:
          report-file: playwright-report/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          custom-info: |
            [Download Playwright report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
