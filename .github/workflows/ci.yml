name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Setup database
        uses: ./.github/actions/setup-db
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Lint
        run: doppler run -- yarn lint
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Typecheck
        run: doppler run -- yarn typecheck
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Unit tests
        run: doppler run -- yarn test:unit
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Production build
        run: doppler run -- yarn build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
