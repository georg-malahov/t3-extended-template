services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build:
      context: .
      target: deps
    command: >
      sh -lc "yarn install --frozen-lockfile &&
      yarn db:generate &&
      node -e \"const {Client}=require('pg');const c=new Client(process.env.DATABASE_URL);c.connect().then(()=>c.query('CREATE SCHEMA IF NOT EXISTS auth')).then(()=>c.end())\" &&
      yarn auth:migrate &&
      yarn db:push &&
      yarn dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB host is "db" container, not localhost — always override
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/app}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://postgres:postgres@db:5432/app?options=-csearch_path%3Dauth}
      # Defaults work out of the box; override via shell env or `doppler run -- docker compose up`
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000/api/auth}
      NODE_ENV: ${NODE_ENV:-development}
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://127.0.0.1:3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules

volumes:
  app-node-modules:
  postgres-data:
